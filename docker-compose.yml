services:
  postgres:
    image: postgres:16-alpine
    container_name: techblocks-db
    environment:
      POSTGRES_DB: techblocks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      # DB_PORT surchargé localement (5434 ici, autre conteneur sur 5432) — défaut specs : 5432
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techblocks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
