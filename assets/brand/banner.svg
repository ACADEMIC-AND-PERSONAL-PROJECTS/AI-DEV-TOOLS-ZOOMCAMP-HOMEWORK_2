  <text x="600" y="262" text-anchor="middle" font-family="Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" letter-spacing="2" fill="#C9D4C6">La documentation collaborative qui a de l'aura</text>

